name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Actions → CI → Run workflow: e.g. after renaming the workers.dev subdomain.
  workflow_dispatch:
    inputs:
      deploy_all:
        description: Redeploy every app, not only the affected ones
        type: boolean
        default: true

permissions:
  contents: read
  # nrwl/nx-set-shas reads past workflow runs to find the last green commit.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build, e2e
    runs-on: ubuntu-latest
    # For the integration tests of the leads repository (libs/api/leads) and
    # the Orbit API's catalog store (apps/orbit-api).
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # The Orbit API (Spring Boot); Gradle finds this JDK for its toolchain.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4

      - name: Zoneless guard (ADR-0004)
        run: pnpm check:zoneless
      - run: pnpm nx format:check
      - name: Design tokens are committed up to date (and pass the contrast gate)
        run: |
          pnpm nx run design-system-tokens:build-tokens --skip-nx-cache
          git diff --exit-code libs/design-system/tokens/src/generated
      - name: The hero's project graph matches the workspace (ADR-0011)
        run: |
          node tools/scripts/export-graph.mjs
          git diff --exit-code libs/three/constellation/src/generated
      - run: pnpm nx affected -t lint test build
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017
      # orbit-api's tests rewrite openapi.json; the TypeScript types follow it.
      - name: The Orbit API contract and its TypeScript types are committed (ADR-0013)
        run: |
          pnpm nx run shared-api-client:generate --skip-nx-cache
          git diff --exit-code apps/orbit-api/openapi.json libs/shared/api-client/src/generated

      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests against production builds
        # The Storybook suite runs in its own job, in the Playwright image.
        run: pnpm nx affected -t e2e --exclude=design-system-e2e
      - name: Lighthouse budgets (performance, a11y 100, SEO 100)
        run: pnpm nx affected -t lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            dist/.playwright
            dist/.lighthouse
            .lighthouseci
          # All three report folders start with a dot.
          include-hidden-files: true
          if-no-files-found: ignore

  storybook:
    name: Storybook (axe, visual regression)
    runs-on: ubuntu-latest
    # The screenshot baselines are made in this image by
    # tools/scripts/visual-baselines.mjs. Its tag must match the installed
    # @playwright/test (ADR-0015).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The container runs as root; git refuses a checkout owned by another user.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - name: Every story passes axe and matches its screenshot
        run: |
          if pnpm nx show projects --affected --withTarget e2e | grep -qx design-system-e2e; then
            pnpm nx run design-system-e2e:e2e
          else
            echo "The Storybook isn't affected."
          fi
        env:
          VISUAL_REGRESSION: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: storybook-reports
          path: dist/.playwright
          include-hidden-files: true
          if-no-files-found: ignore

  deploy:
    name: Deploy to Cloudflare
    needs: [ci, storybook]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      # The shell's deploy prints the CV page to PDF with Chromium.
      - run: pnpm exec playwright install --with-deps chromium

      # Each app deploys on its own; on push only the ones that changed are
      # redeployed. Deploy inputs include the remote registry and hosting script.
      - name: Deploy apps
        run: |
          if [ "$DEPLOY_ALL" = "true" ]; then
            pnpm nx run-many -t deploy --parallel=1
          else
            pnpm nx affected -t deploy --parallel=1
          fi
        env:
          DEPLOY_ALL: ${{ inputs.deploy_all }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Remotes deploy independently; fail the deploy that introduces skew (ADR-0012).
      - name: Shared dependencies match across the live shell and remotes
        run: node tools/scripts/check-skew.mjs
