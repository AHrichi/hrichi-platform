name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Actions → CI → Run workflow: e.g. after renaming the workers.dev subdomain.
  workflow_dispatch:
    inputs:
      deploy_all:
        description: Redeploy every app, not only the affected ones
        type: boolean
        default: true

permissions:
  contents: read
  # nrwl/nx-set-shas reads past workflow runs to find the last green commit.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4

      - name: Zoneless guard (ADR-0004)
        run: pnpm check:zoneless
      - run: pnpm nx format:check
      - run: pnpm nx affected -t lint test build

      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests against production builds
        run: pnpm nx affected -t e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: dist/.playwright
          if-no-files-found: ignore

  deploy:
    name: Deploy to Cloudflare
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4

      # Each app deploys on its own; on push only the ones that changed are
      # redeployed. Deploy inputs include the remote registry and hosting script.
      - name: Deploy apps
        run: |
          if [ "$DEPLOY_ALL" = "true" ]; then
            pnpm nx run-many -t deploy --parallel=1
          else
            pnpm nx affected -t deploy --parallel=1
          fi
        env:
          DEPLOY_ALL: ${{ inputs.deploy_all }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
