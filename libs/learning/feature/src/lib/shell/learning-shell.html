<div class="shell">
  <header class="bar">
    <a class="brand" routerLink="concepts">
      <span aria-hidden="true">✦</span> Learning
    </a>
    <nav class="nav" aria-label="Learning">
      <a
        routerLink="concepts"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        >Concepts</a
      >
      <a
        routerLink="devices"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        >Devices</a
      >
    </nav>
    @let s = status();
    <button
      type="button"
      [class]="'pill pill--' + s.tone"
      [disabled]="!s.canSync"
      (click)="store.syncNow()"
      [attr.aria-label]="s.canSync ? s.label + '. Sync now' : s.label"
    >
      {{ s.label }}
    </button>
  </header>

  <main class="main">
    @if (store.fatal(); as fatal) {
      <p class="fatal" role="alert">{{ fatal }}</p>
    } @else {
      <router-outlet />
    }
  </main>
</div>
