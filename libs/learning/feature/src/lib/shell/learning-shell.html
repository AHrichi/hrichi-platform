<div class="shell" [class.is-standalone]="standalone">
  <header class="bar">
    <a class="brand" routerLink="today">
      <span aria-hidden="true">✦</span> Learning
    </a>
    <nav class="nav" aria-label="Learning">
      @for (item of items; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          [attr.aria-label]="item.iconOnly ? item.label : null"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path [attr.d]="item.icon" />
          </svg>
          <span class="label" [class.label--icon-only]="item.iconOnly">{{
            item.label
          }}</span>
          @if (item.path === 'inbox' && store.drafts().length) {
            <span class="badge"
              >{{ store.drafts().length
              }}<span class="visually-hidden"> drafts</span></span
            >
          }
        </a>
      }
    </nav>
    <div class="bar-end">
      @let s = status();
      <button
        type="button"
        [class]="'pill pill--' + s.tone"
        [disabled]="!s.canSync"
        (click)="store.syncNow()"
        [attr.aria-label]="s.canSync ? s.label + '. Sync now' : s.label"
      >
        {{ s.label }}
      </button>
      <a
        class="guide"
        routerLink="guide"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        aria-label="Guide"
        >?</a
      >
    </div>
  </header>

  <p class="notice" role="status" aria-live="polite">{{ store.notice() }}</p>

  <!-- The portfolio has its own <main>; embedded, this one is no landmark. -->
  <div class="main" [attr.role]="standalone ? 'main' : null">
    @if (store.fatal(); as fatal) {
      <p class="fatal" role="alert">{{ fatal }}</p>
    } @else {
      <router-outlet />
    }
  </div>
</div>
