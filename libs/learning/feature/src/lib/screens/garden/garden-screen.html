<section class="screen" aria-labelledby="garden-title">
  <div class="head">
    <h1 id="garden-title">Garden</h1>
    <a ahButton="ghost" size="sm" routerLink="../concepts">Library</a>
  </div>
  <p class="hint">
    Each plant is a topic and each leaf a concept: seeds become sprouts, leaves,
    blooms and, after months, golden. A drooping leaf wants a review.
  </p>

  <lrn-knowledge-garden
    [plants]="plants()"
    [theme]="store.settings().gardenTheme"
    (reviewRequested)="goToday()"
  />
</section>
