<form
  class="card"
  aria-labelledby="gh-sign-in-title"
  (submit)="$event.preventDefault(); submit(emailBox.value, passwordBox.value)"
>
  <h1 id="gh-sign-in-title" class="title">{{ t().auth.title }}</h1>
  <p class="intro">
    @if (lockedEmail(); as email) {
      {{ i18n.fill(t().auth.again, { email }) }}
    } @else {
      {{ t().auth.intro }}
    }
  </p>

  <label class="label" for="gh-email">{{ t().auth.email }}</label>
  <input
    #emailBox
    id="gh-email"
    class="field"
    type="email"
    name="email"
    autocomplete="username"
    inputmode="email"
    dir="ltr"
    required
    [value]="lockedEmail() ?? ''"
    [readOnly]="lockedEmail() !== null"
  />

  <label class="label" for="gh-password">{{ t().auth.password }}</label>
  <input
    #passwordBox
    id="gh-password"
    class="field"
    type="password"
    name="password"
    autocomplete="current-password"
    dir="ltr"
    required
    [attr.aria-describedby]="errorText() ? 'gh-sign-in-error' : null"
  />

  @if (errorText(); as message) {
    <p id="gh-sign-in-error" class="error" role="alert">{{ message }}</p>
  }

  <button type="submit" class="submit" [disabled]="busy()">
    {{ busy() ? t().auth.busy : t().auth.submit }}
  </button>
</form>
