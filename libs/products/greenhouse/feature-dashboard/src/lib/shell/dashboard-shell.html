<gh-app-bar [product]="t().app.name" [tagline]="t().app.tagline">
  @if (standalone) {
    <gh-lang-switch
      [label]="t().app.language"
      [languages]="languages"
      [current]="i18n.lang()"
      (selected)="setLanguage($event)"
    />
  }
</gh-app-bar>
<div class="dashboard">
  <p class="demo">{{ t().app.demo }}</p>
  <main class="main">
    <router-outlet />
  </main>
</div>
