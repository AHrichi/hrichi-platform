<header class="bar">
  @if (home(); as link) {
    <a class="identity" [class.has-logo]="brand.logo" [routerLink]="link">
      <ng-container [ngTemplateOutlet]="identity" />
    </a>
  } @else {
    <div class="identity" [class.has-logo]="brand.logo">
      <ng-container [ngTemplateOutlet]="identity" />
    </div>
  }
  <div class="actions">
    <ng-content />
  </div>
</header>

<ng-template #identity>
  @if (brand.logo; as logo) {
    <img class="logo" [src]="logo" [alt]="brand.logoAlt" height="32" />
    <span class="divider" aria-hidden="true"></span>
  } @else {
    <gh-mark class="mark" />
  }
  <span class="names">
    <strong class="product">{{ product() }}</strong>
    @if (line(); as text) {
      <small class="tagline">{{ text }}</small>
    }
  </span>
</ng-template>
