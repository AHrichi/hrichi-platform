<ah-modal
  [open]="store.showAddFlashcardModal()"
  title="Author Technical Flashcard"
  eyebrow="Manual Card Authoring"
  size="lg"
  (closed)="close()"
>
  <form [formRoot]="flashcardForm" (ngSubmit)="submitCard()" class="flashcard-form" novalidate>
    <div class="form-group">
      <ah-segmented-control
        label="Competency Tier"
        [options]="tierOptions"
        [value]="model().tier"
        (valueChange)="setTier($event)"
      />
    </div>

    <div class="form-group">
      <label for="cardFront">Front: Question / Scenario Prompt *</label>
      <textarea
        id="cardFront"
        rows="2"
        [formField]="flashcardForm.front"
        class="form-textarea"
        placeholder="e.g. Under what condition does a microtask queue execution block the browser rendering engine?"
        autofocus
      ></textarea>
    </div>

    <div class="form-group">
      <label for="cardBack">Back: Technical Explanation *</label>
      <textarea
        id="cardBack"
        rows="3"
        [formField]="flashcardForm.back"
        class="form-textarea"
        placeholder="e.g. Microtasks (Promises, queueMicrotask) drain completely before the rendering phase or the next macrotask tick. An unyielding microtask chain freezes UI rendering."
      ></textarea>
    </div>

    <div class="form-group">
      <label for="cardCode">Code Snippet (Optional)</label>
      <textarea
        id="cardCode"
        rows="3"
        [formField]="flashcardForm.codeSnippet"
        class="form-textarea code-area"
        placeholder="// Optional illustrative code or gotcha"
      ></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="cardCategory">Subtopic / Category *</label>
        <input
          id="cardCategory"
          type="text"
          [formField]="flashcardForm.category"
          class="form-input"
          placeholder="e.g. Event Loop"
        />
      </div>

      <div class="form-group">
        <label for="cardCitation">Documentation Citation</label>
        <input
          id="cardCitation"
          type="text"
          [formField]="flashcardForm.sourceCitation"
          class="form-input"
          placeholder="e.g. HTML Living Standard §8.1.6"
        />
      </div>
    </div>
  </form>

  <div slot="footer" class="modal-footer-actions">
    <button type="button" ahButton="ghost" size="md" (click)="close()">
      <span>Cancel</span>
    </button>
    <button type="button" ahButton="primary" size="md" (click)="submitCard()">
      <span>Save Flashcard</span>
    </button>
  </div>
</ah-modal>
