<ah-modal
  [open]="store.showJsonImportModal()"
  title="Import Structured Curriculum JSON"
  eyebrow="Pedagogical Schema Ingest"
  size="lg"
  (closed)="close()"
>
  <div class="json-import-body">
    @if (errorStatus(); as err) {
      <ah-alert variant="danger" title="Import Error">
        <span>{{ err }}</span>
      </ah-alert>
    }

    <form [formRoot]="importForm" (ngSubmit)="submitImport()" class="import-form" novalidate>
      <div class="actions-bar">
        <label class="file-upload-label">
          <span>📁 Upload .json file</span>
          <input type="file" accept=".json" (change)="handleFileUpload($event)" class="hidden-file-input" />
        </label>
        <button type="button" ahButton="ghost" size="sm" (click)="loadSample()">
          <span>Load Example Schema</span>
        </button>
      </div>

      <div class="form-group">
        <label for="jsonInput">JSON Payload *</label>
        <textarea
          id="jsonInput"
          rows="10"
          [formField]="importForm.jsonText"
          class="form-textarea code-area"
          placeholder="Paste structured JSON matching StudyLM schema..."
        ></textarea>
      </div>
    </form>
  </div>

  <div slot="footer" class="modal-footer-actions">
    <button type="button" ahButton="ghost" size="md" (click)="close()">
      <span>Cancel</span>
    </button>
    <button type="button" ahButton="primary" size="md" (click)="submitImport()">
      <span>Import Into Active Subject</span>
    </button>
  </div>
</ah-modal>
