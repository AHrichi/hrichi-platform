<ah-modal
  [open]="store.showCreateSubjectModal()"
  [title]="copy().modals.createSubjectTitle"
  [eyebrow]="copy().modals.createSubjectEyebrow"
  size="lg"
  (closed)="close()"
>
  <div class="create-subject-body">
    <ah-alert variant="info" [title]="copy().modals.guardrailTitle">
      <p class="guardrail-desc">
        {{ copy().modals.guardrailDesc }}
      </p>
    </ah-alert>

    <form
      [formRoot]="subjectForm"
      (ngSubmit)="submitSubject(true)"
      class="subject-form"
      novalidate
    >
      <div class="form-group">
        <label for="subjDomain">{{ copy().modals.domainLabel }}</label>
        <select
          id="subjDomain"
          [formField]="subjectForm.domain"
          class="form-select"
        >
          @for (d of domains; track d.id) {
            <option [value]="d.id">{{ d.icon }} {{ d.label }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="subjTitle">{{ copy().modals.subjectNameLabel }}</label>
        <input
          id="subjTitle"
          type="text"
          [formField]="subjectForm.title"
          class="form-input"
          [placeholder]="copy().modals.subjectNamePlaceholder"
        />
      </div>

      <div class="form-group">
        <label for="subjDesc">{{ copy().modals.focusNotesLabel }}</label>
        <textarea
          id="subjDesc"
          rows="2"
          [formField]="subjectForm.description"
          class="form-textarea"
          [placeholder]="copy().modals.focusNotesPlaceholder"
        ></textarea>
      </div>

      <!-- Suggested Topics Quick Pick -->
      <div class="suggested-topics-section">
        <span class="suggested-label">{{ copy().modals.suggestedLabel }}</span>
        <div class="suggested-chips">
          @for (d of domains; track d.id) {
            @for (top of d.suggestedTopics; track top) {
              <button
                type="button"
                class="suggested-chip"
                (click)="selectSuggestedTopic(top, d.id)"
              >
                <span>{{ d.icon }} {{ top }}</span>
              </button>
            }
          }
        </div>
      </div>
    </form>
  </div>

  <div slot="footer" class="modal-footer-actions">
    <button type="button" ahButton="ghost" size="md" (click)="close()">
      <span>{{ copy().modals.cancel }}</span>
    </button>
    <button
      type="button"
      ahButton="secondary"
      size="md"
      (click)="submitSubject(false)"
    >
      <span>{{ copy().modals.createBlank }}</span>
    </button>
    <button
      type="button"
      ahButton="primary"
      size="md"
      (click)="submitSubject(true)"
    >
      <span>{{ copy().modals.createAndGenerate }}</span>
    </button>
  </div>
</ah-modal>
