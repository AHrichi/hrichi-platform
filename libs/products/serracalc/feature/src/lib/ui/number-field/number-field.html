<div class="head">
  <label [for]="id">{{ label() }}</label>
  <span class="tail">
    @if (unit()) {
      <span class="unit" dir="auto">{{ unit() }}</span>
    }
    @if (info(); as i) {
      <button
        #infoButton
        type="button"
        class="info"
        [class.is-open]="tipOpen()"
        [attr.popovertarget]="id + '-tip'"
        [attr.aria-label]="i.title"
        [title]="i.title"
      >
        i
      </button>
    }
  </span>
</div>
<input
  class="exact"
  type="number"
  inputmode="decimal"
  [id]="id"
  [min]="min()"
  [max]="max()"
  [step]="step()"
  [value]="value()"
  [attr.aria-describedby]="hint() ? id + '-hint' : null"
  (input)="onInput($any($event.target).value)"
  (blur)="clamp()"
/>
<input
  class="slider"
  type="range"
  tabindex="-1"
  aria-hidden="true"
  [min]="min()"
  [max]="max()"
  [step]="step()"
  [value]="value()"
  (input)="onInput($any($event.target).value)"
/>
@if (hint()) {
  <small class="hint" [id]="id + '-hint'">{{ hint() }}</small>
}
@if (info(); as i) {
  <div
    #tip
    class="tip"
    popover="auto"
    role="dialog"
    [id]="id + '-tip'"
    [attr.aria-label]="i.title"
    [attr.dir]="i18n.isRtl() ? 'rtl' : 'ltr'"
    [attr.lang]="i18n.lang()"
    (beforetoggle)="place($event)"
    (toggle)="tipOpen.set($any($event).newState === 'open')"
  >
    <div class="tip-head">
      <span class="kind" [attr.data-kind]="i.kind">{{ i.method }}</span>
      <button
        type="button"
        class="close"
        [attr.popovertarget]="id + '-tip'"
        popovertargetaction="hide"
        [attr.aria-label]="t().science.close"
      >
        ×
      </button>
    </div>
    <strong class="tip-title">{{ i.title }}</strong>
    <p>{{ i.methodHint }}</p>
    @if (i.instrument; as tool) {
      <p class="tool">
        <a
          [routerLink]="['..', 'science']"
          [queryParams]="{ instrument: tool.id }"
          >{{ tool.name }}</a
        >
        <span>{{ tool.how }}</span>
      </p>
    }
    @if (i.topic; as topic) {
      <a
        class="more"
        [routerLink]="['..', 'science']"
        [queryParams]="{ topic: topic.id }"
        >{{ t().science.readMore }} {{ topic.title }} →</a
      >
    }
  </div>
}
