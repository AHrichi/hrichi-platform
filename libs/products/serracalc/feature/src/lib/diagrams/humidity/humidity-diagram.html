<svg viewBox="0 0 480 260" role="group" [attr.aria-label]="alt()">
  <defs>
    <marker
      id="sc-hum-cool"
      viewBox="0 0 10 10"
      refX="5"
      refY="5"
      markerWidth="2.2"
      markerHeight="2.2"
      orient="auto-start-reverse"
    >
      <path class="head cool" d="M0 0L10 5L0 10z" />
    </marker>
    <marker
      id="sc-hum-wet"
      viewBox="0 0 10 10"
      refX="5"
      refY="5"
      markerWidth="2.2"
      markerHeight="2.2"
      orient="auto-start-reverse"
    >
      <path class="head wet" d="M0 0L10 5L0 10z" />
    </marker>
  </defs>

  <rect class="backdrop" width="480" height="260" rx="12" />
  <rect class="ground" x="0" y="214" width="480" height="46" />

  <!-- The house at night, dripping when the cover is under the dew point -->
  <path
    class="house"
    [class.wet]="result().condensation"
    d="M120 214V120L260 76L400 120V214Z"
  />
  @if (result().condensation) {
    @for (x of drips; track x) {
      <path
        class="drip"
        [attr.d]="
          'M' +
          x +
          ' ' +
          (x < 260 ? 120 - (x - 120) * 0.31 + 6 : 120 - (400 - x) * 0.31 + 6) +
          'q-3 6 0 8q3 -2 0 -8z'
        "
      />
    }
  }
  <text class="caption" x="260" y="68" text-anchor="middle">
    {{ i18n.word(t().diagrams.coverAt) }}
    {{ i18n.num(result().coverSurfaceC) }} °C
  </text>

  <!-- Dry air in, wet air out -->
  @if (result().airM3h !== null) {
    <path
      class="flow cool"
      [attr.stroke-width]="airWidth()"
      d="M76 196H130"
      marker-end="url(#sc-hum-cool)"
    />
    <path
      class="flow wet"
      [attr.stroke-width]="airWidth()"
      d="M300 92L326 52"
      marker-end="url(#sc-hum-wet)"
    />
  }
  <text class="label" x="470" y="24" text-anchor="end">
    @if (result().airM3h !== null) {
      {{ i18n.num(result().airM3h ?? 0, 0) }} m³/h ·
      {{ i18n.num(result().heatKw, 0) }} kW
    } @else {
      {{ t().diagrams.wetterOutside }}
    }
  </text>

  <!-- Inside: thermometer with the dew point, and the humidity gauge -->
  <rect
    class="tube"
    x="236"
    [attr.y]="yHot - 6"
    width="8"
    [attr.height]="yCold - yHot + 6"
    rx="4"
  />
  <rect
    class="mercury warm"
    x="238"
    [attr.y]="yInside()"
    width="4"
    [attr.height]="yCold - yInside()"
  />
  <line class="dew" x1="226" [attr.y1]="yDew()" x2="254" [attr.y2]="yDew()" />
  <text class="tick-label" x="222" [attr.y]="yDew() + 4" text-anchor="end">
    {{ i18n.word(t().diagrams.dew) }} {{ i18n.num(result().dewPointC) }}°
  </text>
  <text class="value" x="256" [attr.y]="yInside() + 5">
    {{ i18n.num(params().insideC) }} °C
  </text>

  <rect
    class="tube"
    x="326"
    [attr.y]="yRhTop - 6"
    width="10"
    [attr.height]="yRh0 - yRhTop + 12"
    rx="5"
  />
  <rect
    class="mercury wet-fill"
    x="328"
    [attr.y]="yRhValue()"
    width="6"
    [attr.height]="yRh0 + 6 - yRhValue()"
  />
  <text class="value" x="346" [attr.y]="yRhValue() + 5">
    {{ i18n.num(params().insideRhPct, 0) }} %
  </text>
  <text class="tick-label" x="346" [attr.y]="yRhValue() + 20">
    VPD {{ i18n.num(result().vpdKpa, 2) }} kPa
  </text>

  <!-- Outside -->
  <rect
    class="tube"
    x="36"
    [attr.y]="yHot - 6"
    width="8"
    [attr.height]="yCold - yHot + 6"
    rx="4"
  />
  <rect
    class="mercury cool-fill"
    x="38"
    [attr.y]="yOutside()"
    width="4"
    [attr.height]="yCold - yOutside()"
  />
  <text class="caption" x="40" y="76" text-anchor="middle">
    {{ t().diagrams.outside }}
  </text>
  <text class="value" x="56" [attr.y]="yOutside() + 5">
    {{ i18n.num(params().outsideC) }} °C
  </text>

  <g
    scHandle
    [x]="40"
    [y]="yOutside()"
    [value]="params().outsideC"
    [min]="limits.outside.min"
    [max]="limits.outside.max"
    [step]="limits.outside.step"
    [label]="t().fields['outsideC']"
    unit="°C"
    [fromPoint]="tempAt"
    (valueChange)="changed.emit({ key: 'outsideC', value: $event })"
  />
  <g
    scHandle
    [x]="240"
    [y]="yInside()"
    [value]="params().insideC"
    [min]="limits.inside.min"
    [max]="limits.inside.max"
    [step]="limits.inside.step"
    [label]="t().fields['insideC']"
    unit="°C"
    [fromPoint]="tempAt"
    (valueChange)="changed.emit({ key: 'insideC', value: $event })"
  />
  <g
    scHandle
    [x]="331"
    [y]="yRhValue()"
    [value]="params().insideRhPct"
    [min]="limits.rh.min"
    [max]="limits.rh.max"
    [step]="limits.rh.step"
    [label]="t().fields['insideRhPct']"
    unit="%"
    [fromPoint]="rhAt"
    (valueChange)="changed.emit({ key: 'insideRhPct', value: $event })"
  />
</svg>
