<svg viewBox="0 0 480 260" role="group" [attr.aria-label]="alt()">
  <defs>
    <marker
      id="sc-crop-head"
      viewBox="0 0 10 10"
      refX="5"
      refY="5"
      markerWidth="2.2"
      markerHeight="2.2"
      orient="auto-start-reverse"
    >
      <path class="head" d="M0 0L10 5L0 10z" />
    </marker>
  </defs>

  <rect class="backdrop" width="480" height="260" rx="12" />
  <rect class="ground" x="0" [attr.y]="slab + 14" width="480" height="46" />

  <!-- The sun on the peak day -->
  <circle class="sun" cx="34" cy="34" r="14" />
  <text class="caption" x="56" y="30">
    {{ i18n.word(i18n.month(result().peakMonth)) }} ·
    {{ i18n.num(outsideMj()) }} MJ/m²
  </text>
  <text class="caption" x="56" y="46">
    → {{ i18n.word(t().diagrams.inside) }}
    {{ i18n.num(peak().radiationInMj) }} MJ/m²
  </text>

  <!-- The plant on its slab, with its dripper -->
  <rect class="slab" x="80" [attr.y]="slab" width="150" height="14" rx="3" />
  <path class="drip" [attr.d]="'M200 ' + (slab - 30) + 'V' + (slab - 4)" />
  <circle class="dripper" cx="200" [attr.cy]="slab - 30" r="4" />
  <path class="stem" [attr.d]="'M150 ' + slab + 'V' + plantTop()" />
  @for (leaf of leaves(); track $index) {
    <ellipse
      class="leaf"
      [attr.cx]="150 + leaf.side * leaf.size"
      [attr.cy]="leaf.y"
      [attr.rx]="leaf.size"
      [attr.ry]="leaf.size / 2.4"
    />
  }
  <!-- Transpiration rising off the leaves -->
  <g class="vapour">
    <path
      [attr.d]="'M126 ' + (plantTop() + 20) + 'q-6 -10 0 -20t0 -20'"
      marker-end="url(#sc-crop-head)"
    />
    <path
      [attr.d]="'M174 ' + (plantTop() + 26) + 'q6 -10 0 -20t0 -20'"
      marker-end="url(#sc-crop-head)"
    />
  </g>
  <text class="caption" x="150" [attr.y]="slab + 34" text-anchor="middle">
    {{ i18n.word(t().diagrams.canopy) }} {{ i18n.num(params().canopyPct, 0) }} %
  </text>

  <!-- A peak day's irrigation per m²: transpired above, drain below -->
  <rect
    class="used"
    x="290"
    [attr.y]="colTop"
    width="56"
    [attr.height]="yDrain() - colTop"
  />
  <rect
    class="drained"
    x="290"
    [attr.y]="yDrain()"
    width="56"
    [attr.height]="colTop + colH - yDrain()"
  />
  <rect
    class="column"
    x="290"
    [attr.y]="colTop"
    width="56"
    [attr.height]="colH"
    rx="3"
  />
  <text class="value" x="318" [attr.y]="colTop - 12" text-anchor="middle">
    {{ i18n.num(peak().grossLm2) }} L/m²
  </text>
  <text
    class="amount"
    x="318"
    [attr.y]="(colTop + yDrain()) / 2 + 5"
    text-anchor="middle"
  >
    {{ i18n.num(peak().netLm2) }}
  </text>
  <text class="caption" x="356" [attr.y]="(colTop + yDrain()) / 2 + 4">
    {{ i18n.word(t().diagrams.transpired) }}
  </text>
  @if (colTop + colH - yDrain() > 14) {
    <text
      class="amount"
      x="318"
      [attr.y]="(yDrain() + colTop + colH) / 2 + 5"
      text-anchor="middle"
    >
      {{ i18n.num(drainLm2()) }}
    </text>
  }
  <text class="caption" x="356" [attr.y]="(yDrain() + colTop + colH) / 2 + 4">
    {{ i18n.word(t().diagrams.drain) }} {{ i18n.num(params().drainPct, 0) }} %
  </text>
  <path class="flow" d="M232 207H282" marker-end="url(#sc-crop-head)" />

  <g
    scHandle
    [x]="150"
    [y]="plantTop()"
    [value]="params().canopyPct"
    [min]="limits.canopy.min"
    [max]="limits.canopy.max"
    [step]="limits.canopy.step"
    [label]="t().fields['canopyPct']"
    unit="%"
    [fromPoint]="canopyAt"
    (valueChange)="changed.emit({ key: 'canopyPct', value: $event })"
  />
  <g
    scHandle
    [x]="318"
    [y]="yDrain()"
    [value]="params().drainPct"
    [min]="limits.drain.min"
    [max]="limits.drain.max"
    [step]="limits.drain.step"
    [label]="t().fields['drainPct']"
    unit="%"
    [fromPoint]="drainAt"
    (valueChange)="changed.emit({ key: 'drainPct', value: $event })"
  />
</svg>
