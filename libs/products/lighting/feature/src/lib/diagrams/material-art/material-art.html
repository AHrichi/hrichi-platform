<svg viewBox="0 0 160 100" role="img" [attr.aria-label]="label()">
  <rect class="backdrop" width="160" height="100" rx="10" />
  @switch (kind()) {
    @case ('pole') {
      <!-- Octagonal steel pole, single arm, LED head -->
      <path class="metal" d="M74 92l3-78h6l3 78z" />
      <path class="arm" d="M80 18c10-6 26-8 42-6" />
      <path class="head" d="M114 9h22l-3 7h-16z" />
      <path class="beam" d="M117 16l-14 30h40l-12-30z" />
      <rect class="detail" x="76" y="70" width="8" height="12" rx="1" />
      <rect class="base" x="66" y="90" width="28" height="4" rx="1" />
    }
    @case ('conic') {
      <!-- Tapered aluminium pole with a post-top lantern -->
      <path class="metal" d="M72 92l6-70h4l6 70z" />
      <path class="head" d="M70 20h20l-4-8h-12z" />
      <path class="beam" d="M72 20l-16 34h48l-16-34z" />
      <rect class="detail" x="75" y="72" width="10" height="10" rx="1" />
      <rect class="base" x="64" y="90" width="32" height="4" rx="1" />
    }
    @case ('solarPole') {
      <!-- Pole with a tilted panel on top and a battery box -->
      <path class="metal" d="M76 92l2-74h4l2 74z" />
      <path class="panel" d="M58 14l44-8 4 10-44 8z" />
      <path class="cells" d="M69 12l3 10M80 10l3 10M91 8l3 10M61 19l43-8" />
      <path class="arm" d="M80 30h26" />
      <path class="head" d="M100 26h20l-2 6h-16z" />
      <rect class="box" x="70" y="52" width="20" height="18" rx="2" />
      <path class="bolt" d="M80 55l-4 7h5l-3 6" />
      <rect class="base" x="66" y="90" width="28" height="4" rx="1" />
    }
    @case ('luminaire') {
      <!-- Road luminaire from the side, LED board underneath -->
      <path class="arm" d="M14 46h34" />
      <path class="head" d="M44 38h86c8 0 12 4 12 10H44z" />
      <rect class="leds" x="58" y="48" width="70" height="5" rx="2" />
      <path
        class="dots"
        d="M64 50.5h.1M74 50.5h.1M84 50.5h.1M94 50.5h.1M104 50.5h.1M114 50.5h.1M124 50.5h.1"
      />
      <path class="beam" d="M60 54l-18 40h104l-18-40z" />
    }
    @case ('solarLuminaire') {
      <!-- All-in-one: panel on the back, battery and LEDs in one body -->
      <path class="arm" d="M14 50h28" />
      <path class="panel" d="M40 30h96l-6 12H46z" />
      <path class="cells" d="M64 30l-2 12M88 30v12M112 30l2 12M43 36h90" />
      <path class="head" d="M46 42h84l-4 10H50z" />
      <rect class="leds" x="58" y="52" width="60" height="4" rx="2" />
      <path class="beam" d="M60 56l-16 38h88l-16-38z" />
    }
    @case ('panel') {
      <!-- Monocrystalline panel, front -->
      <rect class="frame" x="34" y="10" width="92" height="80" rx="3" />
      <path
        class="cells"
        d="M57 12v76M80 12v76M103 12v76M36 30h88M36 50h88M36 70h88"
      />
      <path class="sun" d="M138 16h.1" />
    }
    @case ('battery') {
      <!-- LiFePO4 block with terminals -->
      <rect class="box" x="38" y="24" width="84" height="62" rx="5" />
      <rect class="terminal" x="52" y="16" width="14" height="9" rx="2" />
      <rect class="terminal" x="94" y="16" width="14" height="9" rx="2" />
      <path class="sign" d="M54 44h10M59 39v10M96 44h10" />
      <path class="bolt" d="M82 54l-8 14h9l-6 12" />
    }
    @case ('bolts') {
      <!-- Anchor cage: four J-bolts, two rings and the top template -->
      <rect class="template" x="40" y="12" width="80" height="8" rx="2" />
      @for (x of [52, 68, 92, 108]; track x) {
        <path class="rod" [attr.d]="'M' + x + ' 8V80c0 8 8 8 10 4'" />
        <path
          class="thread"
          [attr.d]="'M' + (x - 3) + ' 26h6M' + (x - 3) + ' 30h6'"
        />
      }
      <path class="ring" d="M50 44h60M50 66h60" />
    }
    @case ('abc') {
      <!-- Aerial bundled cable between two poles, held by a clamp -->
      <path class="metal" d="M20 92V18h8v74zM132 92V18h8v74z" />
      <path class="abc" d="M28 34c30 26 74 26 104 0" />
      <path class="abc twist" d="M28 34c30 26 74 26 104 0" />
      <rect class="clamp" x="22" y="28" width="14" height="10" rx="2" />
      <rect class="clamp" x="124" y="28" width="14" height="10" rx="2" />
      <path class="drop" d="M80 53v18" />
      <rect class="box-small" x="72" y="70" width="16" height="12" rx="2" />
    }
    @case ('woodPole') {
      <!-- Wooden pole with crossarm, bundled cable and a lamp on an arm -->
      <path class="wood" d="M74 94l2-84h8l2 84z" />
      <path class="grain" d="M78 20v70M82 30v56" />
      <path class="abc" d="M10 26c25 10 45 10 70 4c25 6 45 6 70-4" />
      <path class="arm" d="M84 48c10-6 22-8 34-6" />
      <path class="head" d="M112 39h20l-3 6h-14z" />
    }
    @case ('concretePole') {
      <!-- Tapered concrete pole with its arm and lamp -->
      <path class="concrete" d="M70 94l7-84h6l7 84z" />
      <path class="grain" d="M80 26v6M80 44v6M80 62v6" />
      <path class="arm" d="M83 18c10-6 24-8 36-6" />
      <path class="head" d="M112 9h20l-3 6h-14z" />
      <path class="beam" d="M114 15l-12 26h34l-10-26z" />
    }
    @case ('arm') {
      <!-- A galvanised arm clamped to a pole with steel bands -->
      <rect class="wood" x="30" y="10" width="14" height="84" rx="2" />
      <rect class="clamp" x="27" y="40" width="20" height="5" rx="1" />
      <rect class="clamp" x="27" y="58" width="20" height="5" rx="1" />
      <path class="arm" d="M44 52c24-12 60-18 92-14" />
      <path class="head" d="M126 32h22l-3 7h-16z" />
    }
    @case ('stay') {
      <!-- End pole held by a stay wire to a ground anchor -->
      <rect class="concrete" x="40" y="8" width="12" height="80" rx="2" />
      <rect class="ground" x="0" y="88" width="160" height="12" />
      <path class="stay" d="M50 20L128 88" />
      <circle class="clock" cx="96" cy="60" r="4" />
      <path class="abc" d="M0 22h46" />
      <path class="anchor" d="M128 88v8l-6 4h12l-6-4" />
    }
    @case ('box') {
      <!-- Control cabinet: door, breaker row and a clock -->
      <rect class="box" x="44" y="10" width="72" height="80" rx="4" />
      <path class="door-line" d="M80 10v80" />
      <rect class="breaker" x="52" y="22" width="8" height="16" rx="1" />
      <rect class="breaker" x="62" y="22" width="8" height="16" rx="1" />
      <circle class="clock" cx="98" cy="30" r="9" />
      <path class="sign" d="M98 24v6l4 3" />
      <path class="bolt" d="M66 54l-6 10h7l-4 10" />
    }
    @default {
      <!-- U-1000 R2V cable cut open: sheath, filler, four cores -->
      <circle class="sheath" cx="62" cy="50" r="34" />
      <circle class="filler" cx="62" cy="50" r="27" />
      <circle class="core" cx="51" cy="39" r="10" />
      <circle class="core alt" cx="73" cy="39" r="10" />
      <circle class="core alt2" cx="51" cy="61" r="10" />
      <circle class="core earth" cx="73" cy="61" r="10" />
      <path class="cable-run" d="M96 50h56" />
    }
  }
</svg>
