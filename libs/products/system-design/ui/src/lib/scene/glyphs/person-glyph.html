@let v = view();
@let pw = pillWidth();
<svg:g class="glyph-inner" [class.is-fresh]="fresh()">
  @if (v.state === 'focus') {
    <polygon class="focus-outline" [attr.points]="v.focusRing" />
  }

  <polygon class="face left face-left" [attr.points]="plinth.left" />
  <polygon class="face right face-right" [attr.points]="plinth.right" />

  <g
    class="person-pill"
    [attr.transform]="'translate(' + pillCenter.x + ' ' + pillCenter.y + ')'"
  >
    <rect
      class="face top face-top"
      [attr.x]="-pw / 2"
      y="-12"
      [attr.width]="pw"
      height="24"
      rx="12"
    />
    <g
      class="top-icon"
      [attr.transform]="'translate(' + (-pw / 2 + 6) + ' -7.8) scale(0.65)'"
    >
      @for (d of v.iconPaths; track $index) {
        <path [attr.d]="d" />
      }
    </g>
    <text class="label-text" x="7" y="4">{{ node().label }}</text>
  </g>

  @if (v.state === 'down') {
    <g class="down-overlay">
      <circle
        class="down-disc"
        [attr.cx]="v.downCenter.x"
        [attr.cy]="v.downCenter.y"
        r="10"
      />
      <path
        class="down-mark"
        [attr.d]="
          'M ' +
          (v.downCenter.x - 5) +
          ' ' +
          (v.downCenter.y - 5) +
          ' L ' +
          (v.downCenter.x + 5) +
          ' ' +
          (v.downCenter.y + 5) +
          ' M ' +
          (v.downCenter.x + 5) +
          ' ' +
          (v.downCenter.y - 5) +
          ' L ' +
          (v.downCenter.x - 5) +
          ' ' +
          (v.downCenter.y + 5)
        "
      />
    </g>
  }

  @if (v.loadChip; as load) {
    <g
      class="load-chip"
      [class.load-critical]="load.critical"
      [attr.transform]="
        'translate(' + v.topAnchor.x + ' ' + (v.topAnchor.y - 10) + ')'
      "
    >
      <rect
        class="load-bg"
        [attr.x]="-load.width / 2"
        y="-9"
        [attr.width]="load.width"
        height="17"
        rx="4"
      />
      <text class="load-text" x="0" y="3">{{ load.text }}</text>
    </g>
  }

  @if (v.badgeText; as badge) {
    <g
      class="badge-chip"
      [attr.transform]="
        'translate(' + (v.topAnchor.x + 24) + ' ' + (v.topAnchor.y + 6) + ')'
      "
    >
      <rect
        class="badge-bg"
        [attr.x]="-v.badgeWidth / 2"
        y="-8"
        [attr.width]="v.badgeWidth"
        height="16"
        rx="8"
      />
      <text class="badge-text" x="0" y="3.5">{{ badge }}</text>
    </g>
  }

  @if (node().sublabel; as sub) {
    <g
      class="label-chip"
      [attr.transform]="
        'translate(' + v.bottomAnchor.x + ' ' + (v.bottomAnchor.y + 12) + ')'
      "
    >
      <rect
        class="label-bg"
        [attr.x]="-v.labelWidth / 2"
        y="-8"
        [attr.width]="v.labelWidth"
        height="16"
        rx="4"
      />
      <text class="sublabel-text" x="0" y="3">{{ sub }}</text>
    </g>
  }
</svg:g>
