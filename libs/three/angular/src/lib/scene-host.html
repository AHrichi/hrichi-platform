<!-- Stays in the accessibility tree when hidden: it describes the same picture. -->
<div class="ah-scene__fallback">
  <ng-content />
</div>
@if (state() !== 'fallback') {
  <canvas #canvas class="ah-scene__canvas" aria-hidden="true"></canvas>
}
@if (hover(); as target) {
  <div
    class="ah-scene__label"
    aria-hidden="true"
    [style.translate]="target.x + 'px ' + target.y + 'px'"
  >
    <strong>{{ target.label }}</strong>
    @if (target.detail) {
      <span>{{ target.detail }}</span>
    }
  </div>
}
@if (state() === 'ready' && allowFullscreen()) {
  <button
    type="button"
    class="ah-scene__fullscreen-btn"
    [attr.aria-label]="
      isFullscreen() ? 'Exit fullscreen' : 'View 3D scene in fullscreen'
    "
    [attr.title]="
      isFullscreen() ? 'Exit fullscreen (Esc)' : 'Expand 3D scene to fullscreen'
    "
    (click)="toggleFullscreen()"
  >
    @if (isFullscreen()) {
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <polyline points="4 14 10 14 10 20"></polyline>
        <polyline points="20 10 14 10 14 4"></polyline>
        <line x1="14" y1="10" x2="21" y2="3"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
    } @else {
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <polyline points="15 3 21 3 21 9"></polyline>
        <polyline points="9 21 3 21 3 15"></polyline>
        <line x1="21" y1="3" x2="14" y2="10"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
    }
  </button>
}
