<div class="ah-code-block-header">
  <div class="ah-code-block-meta">
    @if (filename()) {
      <span class="ah-code-filename">{{ filename() }}</span>
    }
    <span class="ah-code-lang">{{ language() }}</span>
  </div>

  @if (allowCopy()) {
    <button
      type="button"
      class="ah-code-copy-btn"
      [class.ah-code-copy-btn--copied]="copied()"
      (click)="copyCode()"
      [attr.aria-label]="copied() ? 'Copied code to clipboard' : 'Copy code to clipboard'"
    >
      {{ copied() ? '✓ Copied' : '📋 Copy' }}
    </button>
  }
</div>

<div class="ah-code-body">
  <pre><code>{{ code() }}</code></pre>
</div>
