<div class="ah-select-container">
  @if (label()) {
    <!-- A <label> focuses the trigger on click; aria-labelledby also reads
         the current value after the label. -->
    <label [id]="selectId + '-label'" [for]="selectId" class="ah-select-label">
      {{ label() }}
    </label>
  }

  <button
    #trigger
    type="button"
    class="ah-select-trigger"
    [id]="selectId"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="listboxId"
    [attr.aria-activedescendant]="activeDescendant()"
    [attr.aria-labelledby]="
      label() ? selectId + '-label ' + selectId : selectId
    "
    [attr.aria-required]="required() || null"
    [attr.aria-invalid]="invalid() || null"
    [disabled]="disabled()"
    (click)="toggleOpen()"
    (keydown)="onTriggerKeydown($event)"
    (blur)="onBlur()"
  >
    <span class="ah-select-trigger-content">
      @if (selectedOption(); as opt) {
        @if (opt.icon) {
          <span class="ah-select-icon" aria-hidden="true">{{ opt.icon }}</span>
        }
        <span class="ah-select-value">{{ opt.label }}</span>
      } @else {
        <span class="ah-select-placeholder">{{ placeholder() }}</span>
      }
    </span>

    <span class="ah-select-chevron" aria-hidden="true">
      <svg viewBox="0 0 20 20" fill="currentColor" class="chevron-svg">
        <path
          fill-rule="evenodd"
          d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
          clip-rule="evenodd"
        />
      </svg>
    </span>
  </button>

  @if (isOpen()) {
    <div
      #popover
      class="ah-select-popover"
      popover="manual"
      [style]="placement()"
    >
      <!-- Options are chosen with the pointer or through the trigger's
           keyboard handling (aria-activedescendant); they never take focus. -->
      <ul
        [id]="listboxId"
        class="ah-select-listbox"
        role="listbox"
        [attr.aria-labelledby]="label() ? selectId + '-label' : null"
      >
        @for (option of options(); track option.value; let idx = $index) {
          <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
          <li
            [id]="optionId(idx)"
            class="ah-select-option"
            [class.ah-select-option--selected]="option.value === value()"
            [class.ah-select-option--active]="idx === activeIndex()"
            [class.ah-select-option--disabled]="option.disabled"
            role="option"
            [attr.aria-selected]="option.value === value()"
            [attr.aria-disabled]="option.disabled || null"
            (click)="selectOption(option)"
            (mousemove)="!option.disabled && activeIndex.set(idx)"
          >
            <span class="ah-select-option-content">
              @if (option.icon) {
                <span class="ah-select-icon" aria-hidden="true">{{
                  option.icon
                }}</span>
              }
              <span class="ah-select-option-text">
                <span class="ah-select-option-label">{{ option.label }}</span>
                @if (option.hint) {
                  <span class="ah-select-option-hint">{{ option.hint }}</span>
                }
              </span>
            </span>

            @if (option.value === value()) {
              <span class="ah-select-check" aria-hidden="true">✓</span>
            }
          </li>
        }
      </ul>
    </div>
  }
</div>
