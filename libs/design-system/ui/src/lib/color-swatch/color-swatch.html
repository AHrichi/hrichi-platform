<div class="swatch-list" [class]="'swatch-list--' + size()">
  @for (item of items(); track item.id; let idx = $index) {
    <button
      #swatch
      type="button"
      role="radio"
      class="swatch-btn"
      [class.is-selected]="value() === item.id"
      [class]="'swatch-btn--' + (item.finish ?? 'gloss')"
      [attr.aria-checked]="value() === item.id"
      [attr.tabindex]="idx === tabStop() ? 0 : -1"
      [attr.aria-label]="
        item.name +
        (item.finish ? ' (' + item.finish + ')' : '') +
        (item.priceLabel ? ' - ' + item.priceLabel : '')
      "
      [disabled]="disabled()"
      (click)="select(item)"
      (keydown)="onKeyDown($event, idx)"
    >
      <span
        class="swatch-color"
        [style.background-color]="item.hex"
        [style.background-image]="
          item.accentHex
            ? 'linear-gradient(135deg, ' +
              item.hex +
              ' 50%, ' +
              item.accentHex +
              ' 50%)'
            : null
        "
      >
        <span class="swatch-finish-layer" aria-hidden="true"></span>
      </span>

      @if (value() === item.id) {
        <span class="swatch-check" aria-hidden="true">
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <polyline points="3.5 8.5 6.5 11.5 12.5 4.5" />
          </svg>
        </span>
      }
    </button>
  }
</div>
