<div
  class="ah-tablist"
  role="tablist"
  [attr.aria-label]="ariaLabel()"
>
  @for (tab of tabs(); track tab.id; let i = $index) {
    <button
      #tabButton
      type="button"
      role="tab"
      class="ah-tab"
      [class.ah-tab--active]="selectedId() === tab.id"
      [class.ah-tab--disabled]="tab.disabled"
      [attr.aria-selected]="selectedId() === tab.id"
      [attr.aria-disabled]="tab.disabled"
      [tabindex]="selectedId() === tab.id ? 0 : -1"
      [disabled]="tab.disabled"
      (click)="selectTab(tab)"
      (keydown)="onKeydown($event, i)"
    >
      @if (tab.icon) {
        <span class="ah-tab-icon" aria-hidden="true">{{ tab.icon }}</span>
      }
      <span class="ah-tab-label">{{ tab.label }}</span>
      @if (tab.count !== undefined) {
        <span class="ah-tab-count">{{ tab.count }}</span>
      }
    </button>
  }
</div>
