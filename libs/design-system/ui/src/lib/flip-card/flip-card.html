<div class="ah-flip-card-inner">
  <div
    class="ah-flip-card-face ah-flip-card-front"
    [attr.inert]="flipped() ? '' : null"
  >
    <ng-content select="[flip-front], [slot=front]" />
  </div>
  <div
    class="ah-flip-card-face ah-flip-card-back"
    [attr.inert]="flipped() ? null : ''"
  >
    <ng-content select="[flip-back], [slot=back]" />
  </div>
</div>
<button
  type="button"
  class="ah-flip-card-toggle"
  [attr.aria-pressed]="flipped()"
  [attr.aria-describedby]="descriptionId"
  (click)="toggle()"
  (keydown)="onToggleKeydown($event)"
>
  <span aria-hidden="true">⟲</span>
  {{ flipLabel() }}
</button>
<span class="ah-visually-hidden" [id]="descriptionId">{{ ariaLabel() }}</span>
