<div class="use-case-focus-wrapper">
  <div class="control-row">
    <span class="control-label" id="focus-label">{{
      copy().focusViewLabel
    }}</span>
    <ah-segmented-control
      [options]="options()"
      [(value)]="value"
      [label]="resolvedAriaLabel()"
    />
  </div>

  @if (value() !== 'all') {
    <div class="active-badge-group">
      <ah-tag> {{ copy().focusedPrefix }} {{ getActiveLabel() }} </ah-tag>
      <button
        type="button"
        ahButton="ghost"
        size="sm"
        (click)="resetToAll()"
        [attr.aria-label]="copy().showAllAriaLabel"
      >
        {{ copy().showAll }}
      </button>
    </div>
  }
</div>
