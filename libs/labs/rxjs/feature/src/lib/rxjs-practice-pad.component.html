<div class="app-container" [class.is-fullscreen]="isFullscreen()">
  <aside class="sidebar" [class.closed]="!isSidebarOpen()">
    <div class="sidebar-header">
      @if (isSidebarOpen()) {
        <div>
          <h1 class="title">RxJS Practice Pad</h1>
          <p class="subtitle">Your personal RxJS laboratory</p>
        </div>
      }
      <div class="sidebar-actions">
        <button
          class="action-btn toggle-btn"
          (click)="toggleSidebar()"
          aria-label="Toggle sidebar"
          [attr.title]="isSidebarOpen() ? 'Collapse sidebar' : 'Expand sidebar'"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </div>
    </div>
    <app-navigation [isOpen]="isSidebarOpen()" />
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
<app-toaster />
