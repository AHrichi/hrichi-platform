<div class="app-container" [class.is-fullscreen]="isFullscreen()">
  <aside class="sidebar" [class.closed]="!isSidebarOpen()">
    <div class="sidebar-header">
      @if (isSidebarOpen()) {
        <div>
          <h1 class="title">RxJS Practice Pad</h1>
          <p class="subtitle">Your personal RxJS laboratory</p>
        </div>
      }
      <div class="sidebar-actions">
        <button
          class="action-btn"
          (click)="toggleFullscreen()"
          [attr.aria-label]="
            isFullscreen() ? 'Exit fullscreen' : 'Enter fullscreen'
          "
          [attr.title]="
            isFullscreen() ? 'Exit fullscreen (Esc)' : 'Enter fullscreen'
          "
        >
          @if (isFullscreen()) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="4 14 10 14 10 20"></polyline>
              <polyline points="20 10 14 10 14 4"></polyline>
              <line x1="14" y1="10" x2="21" y2="3"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
          } @else {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 3 21 3 21 9"></polyline>
              <polyline points="9 21 3 21 3 15"></polyline>
              <line x1="21" y1="3" x2="14" y2="10"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
          }
        </button>
        <button
          class="action-btn toggle-btn"
          (click)="toggleSidebar()"
          aria-label="Toggle sidebar"
          [attr.title]="isSidebarOpen() ? 'Collapse sidebar' : 'Expand sidebar'"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </div>
    </div>
    <app-navigation [isOpen]="isSidebarOpen()" />
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
<app-toaster />
