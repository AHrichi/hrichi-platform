<div
  class="focus-toolbar"
  role="region"
  [attr.aria-label]="effectiveAriaLabel()"
>
  <div class="control-wrapper">
    <ah-segmented-control
      [options]="options()"
      [(value)]="value"
      [label]="effectiveAriaLabel()"
    />
  </div>

  @if (value() !== 'all') {
    <div class="active-badge-group">
      <ah-tag>{{ copy().common.focusedPrefix }} {{ activeLabel() }}</ah-tag>
      <button
        type="button"
        ahButton="ghost"
        size="sm"
        (click)="resetToAll()"
        [attr.title]="copy().common.showAllTitle"
      >
        {{ copy().common.showAll }}
      </button>
    </div>
  }
</div>
