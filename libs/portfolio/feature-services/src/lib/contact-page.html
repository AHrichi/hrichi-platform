<div class="ah-section ah-container ah-stack" style="--gap: var(--space-7)">
  <ah-section-heading
    [level]="1"
    eyebrow="Contact"
    heading="Let's talk"
    lead="About a full-time role or a freelance project. The form reaches me directly; email works too."
  />
  <p class="ah-badge ah-badge--success">{{ profile.availability }}</p>

  <div class="layout">
    <ah-contact-form />

    <aside class="ah-stack" aria-label="Other ways to reach me">
      <dl class="details">
        <div>
          <dt>Email</dt>
          <dd>
            <a [href]="'mailto:' + profile.email">{{ profile.email }}</a>
          </dd>
        </div>
        <div>
          <dt>LinkedIn</dt>
          <dd>
            <a [href]="profile.linkedin" target="_blank" rel="noopener"
              >linkedin.com/in/a-hrichi</a
            >
          </dd>
        </div>
        <div>
          <dt>GitHub</dt>
          <dd>
            <a [href]="profile.github" target="_blank" rel="noopener"
              >github.com/AHrichi</a
            >
          </dd>
        </div>
        <div>
          <dt>Location</dt>
          <dd>{{ profile.location }} · {{ profile.workSetup }}</dd>
        </div>
        <div>
          <dt>Time zone</dt>
          <dd>{{ profile.timezone }}</dd>
        </div>
      </dl>
      <p class="ah-muted">
        Hiring? <a routerLink="/cv">My CV</a> has the details recruiters ask for
        first. A project? See <a routerLink="/services">services</a>.
      </p>
    </aside>
  </div>
</div>
