<div class="ah-section ah-container ah-stack" style="--gap: var(--space-7)">
  <ah-section-heading
    [level]="1"
    [eyebrow]="copy().list.eyebrow"
    [heading]="copy().list.heading"
    [lead]="copy().list.lead"
  />
  <ul class="ah-grid" role="list">
    @for (study of studies(); track study.slug) {
      <li>
        <ah-link-card
          [heading]="study.title"
          [href]="'/work/' + study.slug"
          [eyebrow]="study.client + ' · ' + study.period"
          [summary]="study.summary"
          [tags]="study.stack.slice(0, 4)"
        />
      </li>
    }
  </ul>

  <div
    class="ah-card ah-stack interactive-hub-card"
    style="
      --gap: var(--space-3);
      padding: var(--space-5);
      border-inline-start: 4px solid var(--color-accent-default);
    "
  >
    <p class="ah-eyebrow">{{ copy().list.hubEyebrow }}</p>
    <h2 class="hub-card-title">
      {{ copy().list.hubTitle }}
    </h2>
    <p class="ah-muted hub-card-text">
      {{ copy().list.hubText }}
    </p>
    <div class="hub-card-action">
      <a routerLink="/apps" ahButton="primary" size="md" class="hub-cta-btn">{{
        copy().list.hubAction
      }}</a>
    </div>
  </div>
</div>
