<div class="ah-pick">
  @if (searchable()) {
    <form class="ah-pick__search" role="search" (submit)="search($event)">
      <label class="ah-visually-hidden" for="ah-pick-query">{{
        labels().search
      }}</label>
      <input
        id="ah-pick-query"
        type="search"
        [placeholder]="labels().searchPlaceholder"
        [value]="query()"
        (input)="query.set(text($event))"
      />
      <button
        ahButton="secondary"
        size="sm"
        type="submit"
        [disabled]="searching()"
      >
        🔎 {{ labels().search }}
      </button>
    </form>
    @if (results(); as places) {
      @if (places.length) {
        <ul class="ah-pick__results" role="list">
          @for (place of places; track $index) {
            <li>
              <button type="button" (click)="choose(place)">
                {{ place.name }}
              </button>
            </li>
          }
        </ul>
      } @else {
        <p class="ah-pick__note">{{ labels().noResults }}</p>
      }
    }
  }

  <div
    #map
    class="ah-pick__map"
    role="application"
    [attr.aria-label]="labels().mapLabel"
  ></div>

  <div class="ah-pick__row">
    <p class="ah-pick__note">{{ labels().hint }}</p>
    <button ahButton="ghost" size="sm" type="button" (click)="locate()">
      📍 {{ labels().myLocation }}
    </button>
  </div>
  <p class="ah-pick__coords" dir="ltr">
    {{ coords() }}
  </p>
  @if (notice(); as text) {
    <p class="ah-pick__note" role="status">{{ text }}</p>
  }
</div>
