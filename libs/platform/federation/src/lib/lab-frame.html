<section class="lab ah-container" aria-labelledby="lab-heading">
  <div class="lab__header">
    <ah-section-heading
      class="lab__intro"
      headingId="lab-heading"
      [level]="1"
      [eyebrow]="eyebrow()"
      [heading]="heading()"
      [lead]="lead()"
    />
    <div class="lab__actions">
      <button
        type="button"
        class="lab__fullscreen-btn ah-button ah-button--secondary"
        [attr.aria-label]="
          isFullscreen() ? 'Exit fullscreen' : 'View remote in fullscreen'
        "
        [attr.title]="
          isFullscreen()
            ? 'Exit fullscreen (Esc)'
            : 'Expand remote to fullscreen'
        "
        (click)="toggleFullscreen()"
      >
        @if (isFullscreen()) {
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <polyline points="4 14 10 14 10 20"></polyline>
            <polyline points="20 10 14 10 14 4"></polyline>
            <line x1="14" y1="10" x2="21" y2="3"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          <span>Exit Fullscreen</span>
        } @else {
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          <span>Fullscreen Remote</span>
        }
      </button>
    </div>
  </div>
  <div #labBody class="lab__body" [class.is-fullscreen]="isFullscreen()">
    @if (isFullscreen()) {
      <button
        type="button"
        class="lab__fullscreen-exit"
        aria-label="Exit fullscreen"
        title="Exit fullscreen (Esc)"
        (click)="exitFullscreen()"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    }
    <router-outlet />
  </div>
</section>
