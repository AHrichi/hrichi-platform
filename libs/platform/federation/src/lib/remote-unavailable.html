<section class="remote-unavailable" role="alert">
  @if (missing(); as missing) {
    <h2>{{ copy().needs(missing) }}</h2>
    <p>
      {{ copy().needsDesc(remoteName) }}
    </p>
  } @else {
    <h2>{{ copy().unreachable }}</h2>
    <p>
      {{ copy().unreachableDesc(remoteName) }}
    </p>
    <button type="button" (click)="retry()">{{ copy().retry }}</button>
  }
</section>
