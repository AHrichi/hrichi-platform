<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ahmed Hrichi · Angular &amp; Full-Stack Developer</title>
    <meta
      name="description"
      content="Angular and full-stack developer: micro-frontends, Nx monorepos, Three.js and NestJS. Portfolio, case studies and live labs."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Start the Latin font before the deferred stylesheet asks for it (LCP). -->
    <link
      rel="preload"
      href="media/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      The font faces must exist at first paint. The full stylesheet (which
      declares them too) loads deferred, so without these the first paint
      uses system-ui and every heading re-wraps when Inter takes over: a
      0.19 CLS on the home page. Inter Fallback is a local Arial-metric
      font scaled to Inter, for the moment before the preload lands.
    -->
    <style>
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url(media/inter-latin-wght-normal.woff2) format('woff2-variations');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter Fallback';
        src:
          local('Arial'), local('ArialMT'), local('Liberation Sans'),
          local('Arimo');
        size-adjust: 107.06%;
        ascent-override: 90.49%;
        descent-override: 22.56%;
        line-gap-override: 0%;
      }
    </style>
    <meta name="theme-color" content="#b3122e" />
  </head>
  <body>
    <ah-root></ah-root>
  </body>
</html>
