spring:
  application:
    name: orbit-api
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8081}
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  writer-with-order-by-keys: true

orbit:
  cors-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4302}
