# Render Blueprint: the lead API (ADR-0010) and the Orbit API (ADR-0013).
# Secrets are `sync: false`: Render asks for them once, in its dashboard,
# when the Blueprint is created. Setup steps: docs/lead-pipeline.md.
services:
  - type: web
    name: ahmed-hrichi-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    branch: main
    # Deploy only after GitHub CI passes for the commit.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - libs/api/**
        - libs/shared/contracts/**
        - package.json
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - key: CORS_ORIGINS
        value: https://portfolio.ahmed-hrichi.workers.dev,http://localhost:4200
      - key: MONGODB_DB
        value: portfolio
      - key: MONGODB_URI
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false

  # The Orbit API (ADR-0013, ADR-0017): Spring Boot 4 + Orekit, the Sky lab's
  # night planner. Pure computation: no database, no secrets.
  - type: web
    name: ahmed-hrichi-orbit
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/orbit-api/Dockerfile
    dockerContext: ./apps/orbit-api
    healthCheckPath: /actuator/health
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/orbit-api/**
        - render.yaml
    envVars:
      - key: CORS_ORIGINS
        value: https://portfolio.ahmed-hrichi.workers.dev,https://lab-sky.ahmed-hrichi.workers.dev,http://localhost:4200,http://localhost:4302
